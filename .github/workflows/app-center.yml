name: Build and Deploy to App Center

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Build release APK
      run: ./gradlew assembleRelease
    
    - name: Upload to App Center Distribution
      uses: mobile-center/distribute-apps@v1
      with:
        app-name: ${{ github.repository_owner }}/chanle-recipe-app
        app-secret: ${{ secrets.APP_CENTER_SECRET }}
        file: app/build/outputs/apk/release/app-release.apk
        release-notes: "New version with bug fixes and improvements"
        distribution-method: "groups"
        distribution-group: "Collaborators"
        mandatory-update: false
        notify-testers: true