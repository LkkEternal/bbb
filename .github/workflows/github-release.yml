name: Build and Publish to GitHub Releases

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up signing config
      run: |
        # 将base64编码的keystore写入文件
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
        
        # 创建gradle.properties（包含AndroidX支持和JVM内存配置）
        cat > gradle.properties << 'EOF'
        # AndroidX支持
        android.useAndroidX=true
        android.enableJetifier=true
        
        # JVM内存配置
        org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
        
        # 签名配置
        RELEASE_STORE_FILE=release-key.jks
        RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
        EOF
    
    - name: Get current version
      id: version
      run: |
        VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Build release APK
      run: |
        ./gradlew assembleRelease
        ls -la app/build/outputs/apk/release/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: Release v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/release/*.apk
        body: |
          ## 新版本发布！
          
          ### 更新内容
          - 自动构建发布
          - 完整的应用功能
          
          ### 下载安装
          点击下方 "Assets" 中的 `app-release.apk` 文件下载并安装。
          
          ### 注意事项
          - 请先卸载旧版本再安装新版本
          - 首次安装可能需要授权"未知来源"权限
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}