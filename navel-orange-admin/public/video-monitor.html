<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脐橙病虫害监测 - 视频监控</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus"></script>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<style>
/* ===== 直接复制 variables.scss 的侧边栏变量 ===== */
:root {
  --sidebar-bg: #1A2E1A;
  --sidebar-text: rgba(255,255,255,0.5);
  --sidebar-text-active: #FFFFFF;
  --sidebar-hover: rgba(255,255,255,0.06);
  --sidebar-active-bg: rgba(61,139,64,0.15);
  --sidebar-width: 240px;
  --sidebar-collapsed-width: 72px;
  --header-height: 64px;
  --primary: #3D8B40;
  --primary-subtle: #F0F9F0;
  --accent: #FF8C42;
  --text-primary: #1A1A1A;
  --text-secondary: #6B6B6B;
  --text-placeholder: #9E9E9E;
  --border: #E0D8CC;
  --divider: #EDE8E0;
  --canvas: #F5F2ED;
  --card: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body, #app { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

/* ===== AppLayout ===== */
.app-layout { height: 100vh; overflow: hidden; display: flex; }
.app-sidebar {
  background: var(--sidebar-bg);
  transition: width 0.3s cubic-bezier(0.4,0,0.2,1);
  overflow: hidden;
}
.app-main-container { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.app-header {
  height: var(--header-height); background: var(--card);
  border-bottom: 1px solid var(--border); padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.app-main {
  flex: 1; background: var(--canvas); overflow-y: auto; padding: 0; position: relative;
  background-image: radial-gradient(rgba(61,139,64,0.015) 1px, transparent 1px);
  background-size: 24px 24px;
}
.main-accent-line {
  height: 2px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--primary) 50%, var(--primary) 100%);
  opacity: 0.5;
}
.app-content { padding: 20px; max-width: 1600px; margin: 0 auto; position: relative; z-index: 1; }

/* ===== Header 直接复制原版样式 ===== */
.header-left { display: flex; align-items: center; gap: 16px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.collapse-btn {
  cursor: pointer; color: var(--text-secondary);
  transition: all 0.2s; padding: 6px; border-radius: 6px; display: flex;
}
.collapse-btn:hover { color: var(--primary); background: var(--primary-subtle); }

/* ===== Sidebar 直接复制原版样式 ===== */
.sidebar {
  height: 100%; display: flex; flex-direction: column;
  background: var(--sidebar-bg); position: relative;
}
.sidebar::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(91,140,90,0.08) 0%, transparent 60%);
  pointer-events: none;
}
.sidebar-logo {
  height: 72px; display: flex; align-items: center; padding: 0 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  gap: 12px; overflow: hidden; position: relative; z-index: 1;
}
.logo-icon {
  width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px;
  background: rgba(255,255,255,0.95); padding: 2px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12); transition: transform 0.3s;
}
.sidebar-logo:hover .logo-icon { transform: scale(1.05); }
.logo-text-group { display: flex; flex-direction: column; overflow: hidden; }
.logo-text { color: rgba(255,255,255,0.92); font-size: 16px; font-weight: 700; white-space: nowrap; letter-spacing: 0.5px; }
.logo-sub { color: rgba(255,255,255,0.35); font-size: 11px; white-space: nowrap; margin-top: 1px; letter-spacing: 1px; }

.sidebar-menu-scrollbar { flex: 1; overflow: hidden; padding: 12px 0; position: relative; z-index: 1; }
.el-menu { border-right: none !important; padding: 0 8px !important; }
.el-menu-item, .el-sub-menu__title {
  height: 44px !important; line-height: 44px !important;
  border-radius: 8px !important; padding-left: 16px !important;
  font-size: 14px; font-weight: 500; letter-spacing: 0.3px;
  margin-bottom: 2px; transition: all 0.2s !important;
}
.el-menu-item.is-active { background: var(--sidebar-active-bg) !important; color: #fff !important; }
.el-menu-item.is-active::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 3px;
  background: linear-gradient(180deg, #E8863A 0%, #5B8C5A 100%);
  border-radius: 0 2px 2px 0;
  box-shadow: 0 0 6px rgba(91,140,90,0.3);
}
.el-menu-item.is-active::after {
  content: ''; position: absolute; right: 0; top: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(232,134,58,0.15), transparent);
}
.menu-title { font-size: 14px; font-weight: 500; letter-spacing: 0.3px; }

.sidebar-footer {
  padding: 16px; border-top: 1px solid rgba(255,255,255,0.06);
  position: relative; z-index: 1;
}
.sidebar-footer::before {
  content: ''; position: absolute; top: -1px; left: 20%; right: 20%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(232,134,58,0.3), rgba(91,140,90,0.3), transparent);
}
.footer-user { display: flex; align-items: center; gap: 10px; }
.footer-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, rgba(91,140,90,0.25), rgba(232,134,58,0.15));
  color: rgba(255,255,255,0.8);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
  border: 1.5px solid rgba(255,255,255,0.08);
}
.footer-info { display: flex; flex-direction: column; overflow: hidden; }
.footer-name { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 500; white-space: nowrap; }
.footer-role { color: rgba(255,255,255,0.35); font-size: 11px; margin-top: 1px; }

/* ===== 视频页面样式 ===== */
.page-container { max-width: 1600px; }
.video-card { padding: 0; }
.video-box {
  background: #000; aspect-ratio: 16 / 9; border-radius: 8px;
  overflow: hidden; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.video-box video { width: 100%; height: 100%; object-fit: contain; }
.video-box img { width: 100%; }
.placeholder { text-align: center; color: #556; cursor: pointer; padding: 40px; }
.placeholder .icon { font-size: 56px; margin-bottom: 12px; }
.placeholder .text { font-size: 16px; margin-bottom: 6px; }
.placeholder .sub-text { font-size: 12px; color: #445; }
.status-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot.green { background: #22c55e; animation: blink 1.2s infinite; }
.dot.red { background: #ef4444; }
.dot.yellow { background: #eab308; animation: blink 1.2s infinite; }
.dot.gray { background: #999; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.ptz-panel { padding: 8px 4px; }
.param-group { margin-bottom: 22px; }
.param-group:last-of-type { margin-bottom: 18px; }
.param-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 8px; letter-spacing: 0.3px; }
.quick-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.quick-label { width: 100%; font-size: 12px; color: #aaa; margin-bottom: 6px; }
.cmd-log { max-height: 200px; overflow-y: auto; font-size: 12px; line-height: 1.8; }
.log-line { padding: 2px 0; border-bottom: 1px solid #f0f0f0; }
.log-line.success { color: #94a3b8; }
.log-line.error { color: #ef4444; }
</style>
</head>
<body>
<div id="app">
  <el-container class="app-layout">
    <!-- ===== 侧边栏（直接从 Sidebar.vue 改造） ===== -->
    <el-aside :width="sidebarCollapsed ? '72px' : '240px'" class="app-sidebar">
      <div class="sidebar">
        <div class="sidebar-logo">
          <img src="/logo/672041ffe148a7b5195cd57214d35bb4.png" alt="logo" class="logo-icon" />
          <div v-if="!sidebarCollapsed" class="logo-text-group">
            <span class="logo-text">脐橙监测系统</span>
            <span class="logo-sub">管理后台</span>
          </div>
        </div>

        <el-scrollbar class="sidebar-menu-scrollbar">
          <el-menu
            :default-active="activeMenu"
            :collapse="sidebarCollapsed"
            :collapse-transition="false"
            background-color="transparent"
            text-color="rgba(255,255,255,0.55)"
            active-text-color="#ffffff"
          >
            <!-- 首页看板 -->
            <el-menu-item index="/dashboard" class="sidebar-item" @click="navTo('/dashboard')">
              <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></el-icon>
              <template #title><span class="menu-title">首页看板</span></template>
            </el-menu-item>

            <!-- 果园管理（子菜单） -->
            <el-sub-menu index="/orchard-group">
              <template #title>
                <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></el-icon>
                <span class="menu-title">果园管理</span>
              </template>
              <el-menu-item index="/orchard" @click="navTo('/orchard')"><span>果园列表</span></el-menu-item>
              <el-menu-item index="/devices" @click="navTo('/devices')"><span>设备管理</span></el-menu-item>
            </el-sub-menu>

            <!-- 识别统计 -->
            <el-menu-item index="/detection" class="sidebar-item" @click="navTo('/detection')">
              <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></el-icon>
              <template #title><span class="menu-title">识别统计</span></template>
            </el-menu-item>

            <!-- 农事日历 -->
            <el-menu-item index="/calendar" class="sidebar-item" @click="navTo('/calendar')">
              <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></el-icon>
              <template #title><span class="menu-title">农事日历</span></template>
            </el-menu-item>

            <!-- 消息中心 -->
            <el-menu-item index="/message" class="sidebar-item" @click="navTo('/message')">
              <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></el-icon>
              <template #title><span class="menu-title">消息中心</span></template>
            </el-menu-item>

            <!-- 预警规则 -->
            <el-menu-item index="/alert/rules" class="sidebar-item" @click="navTo('/alert/rules')">
              <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></el-icon>
              <template #title><span class="menu-title">预警规则</span></template>
            </el-menu-item>

            <!-- 文献管理 -->
            <el-menu-item index="/knowledge/docs" class="sidebar-item" @click="navTo('/knowledge/docs')">
              <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></el-icon>
              <template #title><span class="menu-title">文献管理</span></template>
            </el-menu-item>

            <!-- 用户反馈 -->
            <el-menu-item index="/feedback" class="sidebar-item" @click="navTo('/feedback')">
              <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></el-icon>
              <template #title><span class="menu-title">用户反馈</span></template>
            </el-menu-item>

            <!-- 系统管理（子菜单） -->
            <el-sub-menu index="/system">
              <template #title>
                <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></el-icon>
                <span class="menu-title">系统管理</span>
              </template>
              <el-menu-item index="/system/users" @click="navTo('/system/users')">
                <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></el-icon>
                <span>用户管理</span>
              </el-menu-item>
              <el-menu-item index="/ota" @click="navTo('/ota')">
                <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></el-icon>
                <span>OTA 升级</span>
              </el-menu-item>
              <el-menu-item index="/system/logs" @click="navTo('/system/logs')">
                <el-icon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></el-icon>
                <span>操作日志</span>
              </el-menu-item>
            </el-sub-menu>
          </el-menu>
        </el-scrollbar>

        <div class="sidebar-footer" v-if="!sidebarCollapsed">
          <div class="footer-user">
            <div class="footer-avatar">管</div>
            <div class="footer-info">
              <span class="footer-name">管理员</span>
              <span class="footer-role">管理员</span>
            </div>
          </div>
        </div>
      </div>
    </el-aside>

    <!-- ===== 右侧内容（直接从 AppLayout 改造） ===== -->
    <el-container class="app-main-container">
      <el-header class="app-header">
        <div class="header-left">
          <el-icon class="collapse-btn" :size="20" @click="sidebarCollapsed = !sidebarCollapsed">
            <svg v-if="!sidebarCollapsed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            <svg v-else width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </el-icon>
          <span style="font-size:14px;color:#1A1A1A;font-weight:500">📹 视频监控</span>
        </div>
        <div class="header-right">
          <div class="user-info" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px 4px 6px;border-radius:8px">
            <div class="footer-avatar">管</div>
            <span style="font-size:13px;color:#1A1A1A;font-weight:500">管理员</span>
          </div>
        </div>
      </el-header>

      <el-main class="app-main">
        <div class="main-accent-line"></div>
        <div class="app-content">
          <el-card shadow="hover" style="margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
              <span style="font-size:13px;color:#666;white-space:nowrap">视频地址：</span>
              <span style="font-size:13px">http://</span>
              <el-input v-model="editableHost" placeholder="IP地址" style="width:160px" size="small" />
              <span style="font-size:13px">:</span>
              <el-input-number v-model="editablePort" :min="1" :max="65535" style="width:120px" size="small" controls-position="right" />
              <span style="font-size:13px">/</span>
              <el-button size="small" type="primary" @click="applyAddress">应用</el-button>
              <el-button size="small" @click="resetAddress">重置</el-button>
            </div>
          </el-card>

          <el-row :gutter="20">
            <el-col :xs="24" :lg="18">
              <el-card shadow="hover" class="video-card">
                <div class="video-box" id="videoBox" @click="toggleFullscreen">
                  <div class="placeholder" v-if="!streamActive">
                    <div class="icon">📹</div>
                    <div class="text">点击播放视频流</div>
                    <div class="sub-text">http://{{ streamHost }}:{{ httpPort }}/</div>
                  </div>
                  <img ref="imgRef" v-show="streamActive" :src="streamActive ? httpUrl : ''" style="width:100%" @error="onImageError" @load="onImageLoad" />
                  <video ref="videoRef" autoplay playsinline muted style="display:none"></video>
                </div>
                <div class="status-row">
                  <span class="dot" :class="statusClass"></span>
                  <span>{{ statusText }}</span>
                  <el-button size="small" :type="streamActive ? 'danger' : 'primary'" @click="streamActive ? doDisconnect() : doConnect()" style="margin-left:auto">{{ streamActive ? '断开' : '连接' }}</el-button>
                </div>
              </el-card>
            </el-col>
            <el-col :xs="24" :lg="6">
              <el-card shadow="hover">
                <template #header><span>🎮 云台控制</span></template>
                <div class="ptz-panel">
                  <div class="param-group"><label>pitch（俯仰）</label><el-slider v-model="ptz.pitch" :min="-90" :max="90" :step="1" show-input size="small" /></div>
                  <div class="param-group"><label>roll（横滚）</label><el-slider v-model="ptz.roll" :min="-90" :max="90" :step="1" show-input size="small" /></div>
                  <div class="param-group"><label>yaw（旋转）</label><el-slider v-model="ptz.yaw" :min="-180" :max="180" :step="1" show-input size="small" /></div>
                  <div class="ptz-buttons">
                    <el-button type="primary" @click="sendPtz" :loading="sending" style="width:100%">📡 发送控制</el-button>
                  </div>
                </div>
              </el-card>
              <el-card shadow="hover" style="margin-top:16px">
                <template #header><span>📋 命令日志</span></template>
                <div class="cmd-log">
                  <div v-for="(log, i) in cmdLogs" :key="i" class="log-line" :class="{ success: log.ok, error: !log.ok }">{{ log.msg }}</div>
                  <div v-if="cmdLogs.length === 0" class="log-line" style="color:#666">暂无记录</div>
                </div>
              </el-card>
            </el-col>
          </el-row>
        </div>
      </el-main>
    </el-container>
  </el-container>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted } = Vue

const app = createApp({
  setup() {
    const deviceId = Number(new URLSearchParams(location.search).get('deviceId') || 0)
    const sidebarCollapsed = ref(false)
    const activeMenu = ref('/video-monitor')

    // ── 导航（不走 router，直接跳转） ──
    function navTo(path) {
      // 如果是当前视频监控页面的菜单项，只高亮不跳转
      if (path === '/video-monitor') return
      window.location.href = path
    }

    // ── 视频配置 ──
    const httpUrl = ref('')
    const streamHost = ref('192.168.137.112')
    const httpPort = ref(8080)
    const editableHost = ref('192.168.137.112')
    const editablePort = ref(8080)
    function applyAddress() { streamHost.value = editableHost.value; httpPort.value = editablePort.value }
    function resetAddress() { editableHost.value = '192.168.137.112'; editablePort.value = 8080; streamHost.value = editableHost.value; httpPort.value = editablePort.value; addLog('已重置为 192.168.137.112:8080') }
    async function loadVideoConfig() {
      try { const r = await fetch('/api/config/video'); const d = await r.json(); if (d.code === 200 && d.data) { streamHost.value = d.data.host || streamHost.value; httpPort.value = d.data.httpPort || httpPort.value; editableHost.value = streamHost.value; editablePort.value = httpPort.value } } catch {}
    }

    const imgRef = ref(null); const videoRef = ref(null)
    const streamActive = ref(false); const statusText = ref('未连接'); const statusClass = ref('gray')
    function doConnect() { if (streamActive.value) return; httpUrl.value = 'http://' + streamHost.value + ':' + httpPort.value + '/'; addLog('HTTP: ' + httpUrl.value); streamActive.value = true; statusText.value = '播放中'; statusClass.value = 'green' }
    function onImageLoad() { statusText.value = '播放中'; statusClass.value = 'green'; addLog('HTTP 视频流已连接 ✅') }
    function onImageError() { statusText.value = '连接失败'; statusClass.value = 'red'; streamActive.value = false; addLog('HTTP 视频流连接失败 ❌', false) }
    function doDisconnect() { streamActive.value = false; statusText.value = '已断开'; statusClass.value = 'gray'; if (pc) { pc.close(); pc = null }; if (ws) { ws.close(); ws = null }; if (videoRef.value) videoRef.value.srcObject = null; addLog('已断开') }

    // ── WebRTC ──
    let ws = null; let pc = null
    const clientId = Array.from({length:12},()=>'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random()*62)]).join('')
    function doWsConnect() {
      const wsUrl = 'ws://' + streamHost.value + ':' + httpPort.value + '/' + clientId
      addLog('WebSocket: ' + wsUrl); statusText.value = '连接中...'; statusClass.value = 'yellow'
      ws = new WebSocket(wsUrl)
      ws.onopen = () => { addLog('WebSocket 已连接 ✅'); statusText.value = '等待视频流...'; statusClass.value = 'yellow'; ws.send(JSON.stringify({ id: 'server', type: 'request' })) }
      ws.onmessage = async (evt) => { if (typeof evt.data !== 'string') return; const msg = JSON.parse(evt.data); if (msg.type === 'offer') await handleOffer(msg) }
      ws.onerror = () => { addLog('WebSocket 连接失败 ❌', false); statusText.value = '连接失败'; statusClass.value = 'red' }
      ws.onclose = () => { if (!streamActive.value) { statusText.value = '未连接'; statusClass.value = 'gray' } }
    }
    async function handleOffer(offer) {
      pc = new RTCPeerConnection({ bundlePolicy: 'max-bundle', iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }] })
      pc.ontrack = (evt) => { addLog('收到视频流 ✅'); statusText.value = '播放中'; statusClass.value = 'green'; streamActive.value = true; if (videoRef.value) { videoRef.value.style.display = 'block'; videoRef.value.srcObject = evt.streams[0]; videoRef.value.play() } }
      pc.oniceconnectionstatechange = () => { if (pc?.iceConnectionState === 'disconnected' || pc?.iceConnectionState === 'failed') doDisconnect() }
      await pc.setRemoteDescription(offer); const answer = await pc.createAnswer(); await pc.setLocalDescription(answer)
      await new Promise(r => { if (pc.iceGatheringState === 'complete') r(); else pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') r() }) })
      ws?.send(JSON.stringify({ id: 'server', type: answer.type, sdp: answer.sdp })); addLog('SDP Answer 已发送')
    }
    function toggleFullscreen() { const el = videoRef.value; if (!el || el.style.display === 'none') return; if (!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.() }

    // ── PTZ ──
    const ptz = reactive({ pitch: 0, roll: 0, yaw: 0 }); const sending = ref(false); const cmdLogs = ref([])
    function addLog(msg, ok = true) { cmdLogs.value.unshift({ msg, ok }); if (cmdLogs.value.length > 50) cmdLogs.value.pop() }
    async function sendPtz() {
      sending.value = true
      try {
        const cmd = 'pitch=' + ptz.pitch + ' roll=' + ptz.roll + ' yaw=' + ptz.yaw
        addLog('发送云台命令: ' + cmd)
        // 从 localStorage 读取登录 Token（与主系统共享）
        const token = localStorage.getItem('access_token')
        const headers = { 'Content-Type': 'application/json' }
        if (token) headers['Authorization'] = 'Bearer ' + token
        // 通过后端 → IoTDA → 4G → MCU 下发
        const r = await fetch('/api/devices/' + deviceId + '/command', {
          method: 'POST', headers: headers,
          body: JSON.stringify({ commandName: 'control_ptz', paras: { pitch: ptz.pitch, roll: ptz.roll, yaw: ptz.yaw } }),
        })
        if (r.status === 401) { addLog('未登录，请先登录管理系统', false); return }
        if (r.status === 403) { addLog('无权限操作此设备', false); return }
        const d = await r.json()
        if (d.code === 200) addLog('命令已下发 ✅ 设备响应中...')
        else addLog('命令失败: ' + (d.message || '未知'), false)
      } catch(e) {
        addLog('请求失败，后端是否在运行？', false)
      }
      finally { sending.value = false }
    }
    function quickPtz(p, r, y) { ptz.pitch = p; ptz.roll = r; ptz.yaw = y; sendPtz() }

    onMounted(async () => { setTimeout(doWsConnect, 500) })
    onUnmounted(() => { if (pc) { pc.close(); pc = null }; if (ws) { ws.close(); ws = null } })

    return { sidebarCollapsed, activeMenu, navTo, deviceId, httpUrl, streamHost, httpPort, editableHost, editablePort, applyAddress, resetAddress, imgRef, videoRef, streamActive, statusText, statusClass, doConnect, doDisconnect, onImageLoad, onImageError, toggleFullscreen, ptz, sending, cmdLogs, sendPtz, quickPtz }
  }
})

app.use(ElementPlus)
app.mount('#app')
</script>
</body>
</html>
