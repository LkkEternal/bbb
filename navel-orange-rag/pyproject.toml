[project]
name = "navel-orange-rag"
version = "0.1.0"
description = "脐橙病虫害监测系统 - RAG 智能服务（Embedding + LLM + 文档处理）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sentence-transformers>=3.1.0",
    "torch>=2.4.0",
    "openai>=1.55.0",
    "httpx>=0.28.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "numpy>=1.26.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.4.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/"]
