version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: navel-orange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - navel-orange-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: navel-orange-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      TZ: ${TZ}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - navel-orange-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    build:
      context: ./navel-orange-rag
      dockerfile: Dockerfile
    container_name: navel-orange-rag
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "8001:8001"
    volumes:
      - rag_temp:/tmp/navel-orange-rag
    networks:
      - navel-orange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: ./navel-orange-server/Dockerfile
    container_name: navel-orange-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag:
        condition: service_healthy
    networks:
      - navel-orange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  admin:
    build:
      context: ./navel-orange-admin
      dockerfile: Dockerfile
    container_name: navel-orange-admin
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    depends_on:
      - backend
    networks:
      - navel-orange-net

  nginx:
    image: nginx:alpine
    container_name: navel-orange-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - admin_dist:/usr/share/nginx/html
    depends_on:
      - admin
      - backend
    networks:
      - navel-orange-net

volumes:
  postgres_data:
  redis_data:
  rag_temp:
  backend_uploads:
  admin_dist:

networks:
  navel-orange-net:
    driver: bridge
