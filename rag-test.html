<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍊 脐橙 RAG 智能问答测试</title>
<!-- 轻量 Markdown 渲染（无外部依赖） -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .container { background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); width: 100%; max-width: 760px; padding: 30px; }
  h1 { font-size: 22px; color: #d35400; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  h1 small { font-size: 13px; color: #999; font-weight: normal; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
  .status-bar { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .status-item { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 14px; border-radius: 20px; background: #f5f5f5; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-green { background: #27ae60; }
  .dot-red { background: #e74c3c; }
  .dot-gray { background: #bdc3c7; }
  .chat-box { background: #f8f9fa; border-radius: 12px; padding: 16px; height: 420px; overflow-y: auto; margin-bottom: 16px; border: 1px solid #e9ecef; }
  .msg { margin-bottom: 14px; display: flex; flex-direction: column; }
  .msg-user { align-items: flex-end; }
  .msg-assistant { align-items: flex-start; }
  .msg-bubble { max-width: 90%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.7; word-break: break-word; }
  .msg-user .msg-bubble { background: #d35400; color: #fff; border-bottom-right-radius: 4px; }
  .msg-assistant .msg-bubble { background: #fff; color: #333; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
  .msg-label { font-size: 11px; color: #999; margin-bottom: 3px; margin-left: 4px; }

  /* ── 输入区 + 禁用态 ── */
  .input-row { display: flex; gap: 10px; }
  .input-row input { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .input-row input:focus { border-color: #d35400; }
  .input-row input:disabled { background: #f5f5f5; border-color: #ddd; color: #bbb; }
  .input-row button { padding: 12px 28px; background: #d35400; color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; transition: all 0.2s; white-space: nowrap; min-width: 80px; }
  .input-row button:hover:not(:disabled) { background: #e67e22; }
  .input-row button:disabled { background: #ccc; cursor: not-allowed; }

  /* ── 快捷按钮禁用态 ── */
  .quick-questions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .quick-questions button { padding: 6px 14px; border: 1px solid #ddd; border-radius: 16px; background: #fff; font-size: 12px; color: #666; cursor: pointer; transition: all 0.2s; }
  .quick-questions button:hover:not(:disabled) { border-color: #d35400; color: #d35400; background: #fff5f0; }
  .quick-questions button:disabled { opacity: 0.4; cursor: not-allowed; }

  .footer { margin-top: 16px; font-size: 12px; color: #bbb; text-align: center; }
  .model-tag { font-size: 11px; color: #999; margin-top: 4px; margin-left: 4px; }

  /* ── 等待状态 ── */
  .waiting-dot { display: inline-block; width: 6px; height: 6px; background: #d35400; border-radius: 50%; margin-right: 6px; animation: blink 0.8s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

  /* ── 思考折叠（仿 DeepSeek） ── */
  .think-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; padding: 5px 12px; margin-bottom: 4px; border-radius: 8px; background: #f0f0f0; width: fit-content; font-size: 13px; color: #888; transition: background 0.2s; }
  .think-toggle:hover { background: #e8e8e8; }
  .think-toggle .arrow { display: inline-block; transition: transform 0.2s; font-size: 10px; }
  .think-toggle .arrow.open { transform: rotate(90deg); }
  .think-content { padding: 8px 14px; background: #f9f9f9; border-radius: 8px; border-left: 3px solid #ddd; font-size: 13px; color: #999; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin-bottom: 8px; display: none; }
  .think-content.show { display: block; }

  /* ── Markdown ── */
  .msg-bubble p { margin: 6px 0; }
  .msg-bubble ul, .msg-bubble ol { margin: 4px 0; padding-left: 20px; }
  .msg-bubble li { margin: 2px 0; }
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3, .msg-bubble h4 { margin: 10px 0 4px; color: #222; }
  .msg-bubble h1 { font-size: 17px; }
  .msg-bubble h2 { font-size: 16px; }
  .msg-bubble h3 { font-size: 15px; }
  .msg-bubble strong { color: #d35400; }
  .msg-bubble code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; font-size: 13px; color: #e74c3c; }
  .msg-bubble pre { background: #f5f5f5; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
  .msg-bubble pre code { background: none; color: #333; padding: 0; }
  .msg-bubble blockquote { border-left: 3px solid #d35400; padding-left: 12px; color: #666; margin: 8px 0; }
  .msg-bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .msg-bubble th, .msg-bubble td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 13px; }
  .msg-bubble th { background: #f5f5f5; font-weight: 600; }
  .msg-bubble a { color: #d35400; text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>🍊 脐橙 RAG 智能问答 <small>流式 SSE</small></h1>
  <div class="subtitle">DeepSeek / Qwen3-32B · 知识库检索</div>
  <div class="status-bar">
    <span class="status-item"><span class="status-dot dot-gray" id="ragDot"></span> RAG <span id="ragStatus">检测中...</span></span>
    <span class="status-item"><span class="status-dot dot-gray" id="backendDot"></span> 后端 <span id="backendStatus">检测中...</span></span>
    <span class="status-item">模型: <span id="modelLabel">-</span></span>
  </div>
  <div class="chat-box" id="chatBox">
    <div class="msg msg-assistant">
      <div class="msg-label">系统</div>
      <div class="msg-bubble"><p>👋 你好！我是脐橙病虫害专家助手。</p><p>可直接提问，或点下方预设问题测试知识库检索。</p></div>
    </div>
  </div>
  <div class="input-row">
    <input type="text" id="questionInput" placeholder="输入问题..." onkeydown="onInputKey(event)">
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
  <div class="quick-questions" id="quickBtns">
    <button onclick="ask('柑橘溃疡病有什么症状？')">🔍 溃疡病症状</button>
    <button onclick="ask('脐橙红蜘蛛怎么防治？')">🔍 红蜘蛛防治</button>
    <button onclick="ask('6月份脐橙果园要做什么农事？')">🔍 6月农事</button>
    <button onclick="ask('脐橙炭疽病用什么药？')">🔍 炭疽病用药</button>
    <button onclick="ask('如何判断柑橘是否缺硼？')">🔍 缺硼判断</button>
    <button onclick="switchModel()">🔄 切换模型</button>
  </div>
  <div class="footer">RAG:18001 | 后端:8080 | <span id="currentModelDisplay">deepseek</span></div>
</div>

<script>
const RAG_URL = 'http://localhost:18001';
const BACKEND_URL = 'http://localhost:8080';
let currentModel = 'deepseek';
let isProcessing = false;

window.onload = function() { checkAllHealth(); };

// ═══════════ 控件状态 ═══════════

function setControlsDisabled(disabled) {
  document.getElementById('sendBtn').disabled = disabled;
  document.getElementById('questionInput').disabled = disabled;
  document.querySelectorAll('#quickBtns button').forEach(b => b.disabled = disabled);
}

function onInputKey(e) {
  if (e.key === 'Enter' && !isProcessing) send();
}

// ═══════════ 健康检查 ═══════════

async function checkAllHealth() {
  try {
    const res = await fetch(RAG_URL + '/health');
    const d = await res.json();
    if (d.status === 'ok') {
      setDot('ragDot', true);
      document.getElementById('ragStatus').textContent = '运行中 ✅';
      const ms = [];
      if (d.llm_deepseek_configured) ms.push('DeepSeek');
      if (d.llm_qwen_local_configured) ms.push('Qwen3-32B');
      document.getElementById('modelLabel').textContent = ms.join(' + ') || '未知';
    } else { setDot('ragDot', false); document.getElementById('ragStatus').textContent = '异常'; }
  } catch(e) { setDot('ragDot', false); document.getElementById('ragStatus').textContent = '未连接 ❌'; }
  try {
    const r = await fetch(BACKEND_URL + '/api/auth/login/password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: '13800138000', password: 'password123' })
    });
    if (r.ok) { setDot('backendDot', true); document.getElementById('backendStatus').textContent = '在线 ✅'; }
    else { setDot('backendDot', false); document.getElementById('backendStatus').textContent = '异常'; }
  } catch(e) { setDot('backendDot', false); document.getElementById('backendStatus').textContent = '未连接 ❌'; }
}
function setDot(id, ok) { document.getElementById(id).className = 'status-dot ' + (ok ? 'dot-green' : 'dot-red'); }

function switchModel() {
  if (isProcessing) return;
  currentModel = currentModel === 'deepseek' ? 'qwen-local' : 'deepseek';
  document.getElementById('currentModelDisplay').textContent = currentModel;
  addMessage('🔄 已切换到: **' + currentModel + '**', 'assistant');
}

// ═══════════ 发送 ═══════════

function send() {
  if (isProcessing) return;
  const input = document.getElementById('questionInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  askQuestion(text);
}

async function ask(text) {
  if (isProcessing) return;
  document.getElementById('questionInput').value = text;
  await askQuestion(text);
}

// ═══════════ 流式问答 ═══════════

async function askQuestion(text) {
  isProcessing = true;
  setControlsDisabled(true);
  addMessage(text, 'user');

  const box = document.getElementById('chatBox');
  const waitDiv = document.createElement('div');
  waitDiv.className = 'msg msg-assistant';
  waitDiv.id = 'waitMsg';
  waitDiv.innerHTML = '<div class="msg-label">助手</div><div class="msg-bubble" style="color:#999"><span class="waiting-dot"></span>检索知识库中 <span id="waitTimer">0</span>s</div>';
  box.appendChild(waitDiv);
  box.scrollTop = box.scrollHeight;

  let sec = 0;
  const timer = setInterval(() => {
    sec++;
    const el = document.getElementById('waitTimer');
    if (el) el.textContent = sec;
  }, 1000);

  // ── 主流程：RAG 问答（知识库检索 + LLM 生成） ──
  //  纯 RAG，不降级到纯 LLM 对话
  try {
    const loginRes = await fetch(BACKEND_URL + '/api/auth/login/password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: '13800138000', password: 'password123' })
    });
    const loginData = await loginRes.json();
    if (loginData.code !== 200) throw new Error('登录失败');

    const token = loginData.data.accessToken;
    clearInterval(timer);
    waitDiv.innerHTML = '<div class="msg-label">助手</div><div class="msg-bubble" style="color:#999"><span class="waiting-dot"></span>知识库检索中...</div>';

    const ragRes = await fetch(BACKEND_URL + '/api/knowledge/qa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ question: text, model: currentModel })
    });
    const ragData = await ragRes.json();
    clearInterval(timer);
    waitDiv.remove();

    if (ragData.code === 200) {
      const d = ragData.data;
      const refs = d.references || [];

      if (!d.answer || d.answer.trim() === '' || refs.length === 0) {
        // 知识库没有检索到相关内容
        addMessage('不知道', 'assistant', d.model + ' (RAG)');
      } else {
        // 有检索结果 → 显示回答 + 引用来源
        let md = d.answer;
        if (refs.length > 0) {
          md += '\n\n---\n📚 **知识库引用来源**\n' + refs.map((r,i) =>
            '- [' + (i+1) + '] **' + r.documentTitle + '**（相关度 ' + (r.similarity*100).toFixed(0) + '%）'
          ).join('\n') + '\n\n> 共检索到 ' + refs.length + ' 条相关记录';
        }
        addMessage(md, 'assistant', d.model + ' (RAG)');
      }
    } else {
      addMessage('后端错误: ' + (ragData.message || '未知错误'), 'assistant');
    }
  } catch(e) {
    clearInterval(timer);
    const wm = document.getElementById('waitMsg');
    if (wm) wm.remove();
    addMessage('❌ 服务不可用（后端不通）', 'assistant');
  }

  isProcessing = false;
  setControlsDisabled(false);
}

// ═══════════ 工具 ═══════════

function addMessage(text, role, model) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  div.innerHTML = '<div class="msg-label">' + (role === 'user' ? '你' : '助手') + '</div>' +
    '<div class="msg-bubble">' + (role === 'user' ? escHtml(text) : renderMarkdown(text)) + '</div>' +
    (model ? '<div class="model-tag">🤖 ' + escHtml(model) + '</div>' : '');
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ═══════════ Markdown 渲染（无外部依赖） ═══════════

function renderMarkdown(text) {
  if (!text) return '';
  let html = escHtml(text);
  // 代码块 (```)
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // 行内代码 (`code`)
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 加粗 (**text**)
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // 斜体 (*text*)
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // 链接 [text](url)
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // 标题 (### text / ## text / # text)
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
  // 引用 (> text)
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // 无序列表 (- item)
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // 有序列表 (1. item)
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ol>$&</ol>');
  // 分隔线 (---)
  html = html.replace(/^---$/gm, '<hr>');
  // 段落（把连续非空行包在 <p> 里）
  const lines = html.split('\n');
  let result = '';
  let inBlock = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) { if (inBlock) { result += '</p>'; inBlock = false; } continue; }
    // 跳过已经在块标签内的行
    if (line.startsWith('<pre') || line.startsWith('<ul') || line.startsWith('<ol')
        || line.startsWith('<blockquote') || line.startsWith('<h') || line.startsWith('<hr')
        || line.startsWith('<li') || line.startsWith('</ul') || line.startsWith('</ol')
        || line.startsWith('</pre')) {
      result += line + '\n';
      continue;
    }
    if (line.startsWith('</')) { result += line + '\n'; continue; }
    if (!inBlock) { result += '<p>'; inBlock = true; }
    result += line + ' ';
  }
  if (inBlock) result += '</p>';
  // 合并相邻的 <li>
  return result.replace(/(<li>.*?)(\n?<\/li>)/g, '$1$2');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
