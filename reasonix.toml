\"))\n                .header(\"Content-Type\", \"application/json\")\n                .timeout(Duration.ofMillis(30000))\n                .POST(HttpRequest.BodyPublishers.ofString(body, StandardCharsets.UTF_8))\n                .build();\n        \n        System.out.println(\"HEADERS=\" + request.headers().map());\n        \n        HttpResponse<String> resp = client.send(request, HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8));\n        System.out.println(\"STATUS=\" + resp.statusCode());\n        if (resp.statusCode() == 200) {\n            System.out.println(\"OK: dim=\" + mapper.readTree(resp.body()).get(\"dim\").asInt());\n        } else {\n            System.out.println(\"ERR=\" + resp.body());\n        }\n    }\n}\n'''\n\n# Find Jackson JARs\nimport subprocess, glob\nhome = os.path.expanduser(\"~\")\nrepo = os.path.join(home, \".m2\", \"repository\", \"com\", \"fasterxml\", \"jackson\")\ncp = []\nfor root, dirs, files in os.walk(repo):\n    for f in files:\n        if f.endswith(\".jar\") and (\"jackson-databind\" in root or \"jackson-core\" in root or \"jackson-annotations\" in root):\n            cp.append(os.path.join(root, f))\n\ncp_str = \";\".join(cp) if cp else \".\"\n\nwith open(\"TestEmbed4.java\", \"w\", encoding=\"utf-8\") as f:\n    f.write(java_code)\n\n# Compile\nresult = subprocess.run(\n    [\"javac\", \"-encoding\", \"UTF-8\", \"-cp\", cp_str, \"TestEmbed4.java\", \"-d\", \".\"],\n    capture_output=True, text=True\n)\nprint(\"COMPILE:\", result.stdout, result.stderr)\n\n# Run\nresult = subprocess.run(\n    [\"java\", \"-cp\", f\".;{cp_str}\", \"-Dfile.encoding=UTF-8\", \"TestEmbed4\"],\n    capture_output=True, text=True, timeout=30\n)\nprint(\"STDOUT:\", result.stdout)\nprint(\"STDERR:\", result.stderr[:500] if result.stderr else \"\")\nPYEOF)", "Bash(cd \"C:\\Users\\28705\\Desktop\\脐橙检测\" && uv run python run_test.py 2>&1)", "Bash(find \"C:\\Users\\28705\\.m2\\repository\\com\\fasterxml\\jackson\" -name \"*.jar\" ! -name \"*s